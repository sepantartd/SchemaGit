<!DOCTYPE html>
<html>
<head>
    <title>Project Members</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f5f5f5; }
        .btn { padding: 6px 12px; background: #007bff; color: white; border-radius: 4px; text-decoration: none; }
        .btn-danger { background: #dc3545; }
        input, select { padding: 6px; margin-bottom: 10px; width: 260px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<h1>Members: {{ .Project.Name }}</h1>

<a href="/project?id={{ .Project.ID }}" class="btn">← Back to Project</a>

<h2>Add Member</h2>

<form method="POST" action="/project/members/add?id={{ .Project.ID }}">
    <label>Email</label>
    <input type="email" name="email" required>

    <label>Role</label>
    <select name="role">
        <option value="owner">Owner</option>
        <option value="admin">Admin</option>
        <option value="write">Write</option>
        <option value="read">Read</option>
    </select>

    <br>
    <button class="btn" type="submit">Add Member</button>
</form>

<h2>Current Members</h2>

<table>
    <tr>
        <th>Email</th>
        <th>Role</th>
        <th>Invited At</th>
        <th>Actions</th>
    </tr>
    {{ if .Members }}
        {{ range .Members }}
            <tr>
                <td>{{ .Email }}</td>
                <td>{{ .Role }}</td>
                <td>{{ .InvitedAt }}</td>
                <td>
                    <a href="/project/members/delete?member_id={{ .ID }}&project_id={{ .ProjectID }}" class="btn btn-danger">Remove</a>
                </td>
            </tr>
        {{ end }}
    {{ else }}
        <tr>
            <td colspan="4">No members yet.</td>
        </tr>
    {{ end }}
</table>

</body>
</html>
