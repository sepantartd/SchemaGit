<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Organization Webhooks</title>
<style>body{font-family:system-ui;margin:0;padding:24px;background:#f6f8fa}main{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:18px;margin-bottom:16px}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin-top:8px}button{background:#0969da;color:#fff;border:0;border-radius:6px;cursor:pointer}.item{padding:10px 0;border-bottom:1px solid #eee;overflow-wrap:anywhere}.muted{color:#57606a}.error{color:#b42318}.success{color:#1a7f37}</style></head>
<body><main><h1>Organization Webhooks</h1><div class="card"><label>Organization</label><select id="org"></select><label>Webhook URL</label><input id="url" type="url" placeholder="https://example.com/hooks/schemagit"><button id="add">Add Webhook</button><p id="message" role="status"></p></div><div class="card"><h2>Existing webhooks</h2><div id="list" class="muted">Loading…</div></div></main>
<script>
const auth=()=>({Authorization:localStorage.getItem("token")||""});
const message=(text,cls="")=>{const e=document.getElementById("message");e.textContent=text;e.className=cls;};
async function loadOrgs(){const r=await fetch("/api/org/list",{headers:auth()});if(!r.ok)throw Error("Unable to load organizations");const orgs=await r.json();const select=document.getElementById("org");select.replaceChildren();orgs.forEach(o=>{const option=document.createElement("option");option.value=o.id;option.textContent=o.name+" ("+o.id+")";select.appendChild(option);});await loadHooks();}
async function loadHooks(){const id=document.getElementById("org").value;const list=document.getElementById("list");if(!id){list.textContent="No organizations available.";return;}list.textContent="Loading…";const r=await fetch("/api/webhooks/list?org="+encodeURIComponent(id),{headers:auth()});if(!r.ok)throw Error("Unable to load webhooks");const hooks=await r.json();list.replaceChildren();if(!hooks.length){list.textContent="No webhooks yet.";return;}hooks.forEach(h=>{const row=document.createElement("div");row.className="item";row.textContent=h.url;list.appendChild(row);});}
document.getElementById("org").addEventListener("change",()=>loadHooks().catch(e=>message(e.message,"error")));
document.getElementById("add").addEventListener("click",async()=>{try{const r=await fetch("/api/webhooks/add",{method:"POST",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({org_id:document.getElementById("org").value,url:document.getElementById("url").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Unable to add webhook");document.getElementById("url").value="";message("Webhook added.","success");await loadHooks();}catch(e){message(e.message,"error");}});
loadOrgs().catch(e=>message(e.message,"error"));
</script></body></html>
