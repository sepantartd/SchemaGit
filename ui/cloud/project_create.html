<!DOCTYPE html>
<html>
<head>
    <title>{{ .Title }}</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, select { padding: 6px; width: 300px; margin-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        .btn { padding: 8px 14px; background: #007bff; color: white; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>

<h1>Create Project</h1>

<a href="/" class="btn">← Back to Dashboard</a>

<form method="POST">

    <label>Project Name</label>
    <input type="text" name="name" value="">

    <label>DB Type</label>
    <select name="db_type">
        <option value="sqlite">SQLite</option>
        <option value="postgres">PostgreSQL</option>
        <option value="mysql">MySQL</option>
    </select>

    <label>SQLite Path</label>
    <input type="text" name="sqlite_path" value="./project.db">

    <label>PostgreSQL Host</label>
    <input type="text" name="pg_host" value="localhost">

    <label>PostgreSQL Port</label>
    <input type="text" name="pg_port" value="5432">

    <label>PostgreSQL User</label>
    <input type="text" name="pg_user" value="">

    <label>PostgreSQL Pass</label>
    <input type="text" name="pg_pass" value="">

    <label>PostgreSQL DB Name</label>
    <input type="text" name="pg_name" value="">

    <label>MySQL Host</label>
    <input type="text" name="my_host" value="localhost">

    <label>MySQL Port</label>
    <input type="text" name="my_port" value="3306">

    <label>MySQL User</label>
    <input type="text" name="my_user" value="">

    <label>MySQL Pass</label>
    <input type="text" name="my_pass" value="">

    <label>MySQL DB Name</label>
    <input type="text" name="my_name" value="">

    <br><br>
    <button class="btn" type="submit">Create</button>

</form>

</body>
</html>
